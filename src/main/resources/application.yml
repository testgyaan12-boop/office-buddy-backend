server:
  port: 8080

spring:
  datasource:
    url: ${DATABASE_URL:}
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 30000
      data-source-properties:
        prepareThreshold: 0
        preparedStatementCacheQueries: 0
  # Render/Supabase pooler needs sslmode=require & pgbouncer=true — set via DATABASE_URL query params
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

app:
  jwt:
    secret: ${JWT_SECRET:}
    expiration-ms: 86400000
    refresh-expiration-ms: 2592000000
  storage:
    type: cloudinary
    local:
      upload-dir: uploads
    s3:
      bucket-name: officebuddy-docs
      region: us-east-1
      access-key: ${AWS_ACCESS_KEY:}
      secret-key: ${AWS_SECRET_KEY:}
    cloudinary:
      cloud-name: ${CLOUDINARY_CLOUD_NAME:}
      api-key: ${CLOUDINARY_API_KEY:}
      api-secret: ${CLOUDINARY_API_SECRET:}

  ai:
    gemini-api-key: ${GEMINI_API_KEY:}
  email:
    resend-api-key: ${RESEND_API_KEY:}
    from-address: ${EMAIL_FROM:OfficeBuddy <noreply@packsyourbags.in>}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  health:
    db:
      enabled: true
  info:
    java:
      enabled: true

logging:
  level:
    com.officebuddy: DEBUG
